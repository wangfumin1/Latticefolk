name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check
        run: npm run check

  playable-e2e:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playable browser smoke
        run: npm run test:e2e
      - name: Upload playable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
          retention-days: 14
