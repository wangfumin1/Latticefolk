name: One-shot home placement tree transfer
on:
  push:
    branches: [transfer/69-home-restore]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe29a67461f3c28b30a61d503a5a1e92e02d0c40
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact locally checked patch to its exact base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/wangfumin1/Latticefolk/git/ref/heads/main --jq .object.sha)" = fe29a67461f3c28b30a61d503a5a1e92e02d0c40
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='76a11f1f19413e1773146961f1ca76517cf14765d3ff116f38fd20cfdcd390e3'
          Path('/tmp/home-restore.patch').write_bytes(patch)
          PY
          git apply --check /tmp/home-restore.patch
          git apply /tmp/home-restore.patch
      - name: Recheck exact transferred implementation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check 2>&1 | tee /tmp/home-restore-check.log
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --esModuleInterop --skipLibCheck --types node --lib ES2022,DOM e2e/baking-oven.spec.ts
      - name: Verify final bytes and create only a Git tree object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/wangfumin1/Latticefolk/git/ref/heads/main --jq .object.sha)" = fe29a67461f3c28b30a61d503a5a1e92e02d0c40
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected={
            'src/main.ts':'9a172519b7fb6ccb734d8632d555bc4a14ed303b674f7dabcacbc4f839138476',
            'src/world/finePhysics.ts':'a34c5a9d1704f88ddd4f7381c28a579bc43727b4642970d2fe6571f910154390',
            'src/world/homeObjectRestore.ts':'612d0360b304d82dcaeb90eb6607a9516af51fd609c3a569c25a3892cfeafda9',
            'tests/home-object-restore.test.ts':'8c91980c28e789d86d14e8da047f141cec29a2f2d5d37887ed9c97719a2c6ec4',
            'e2e/baking-oven.spec.ts':'0135081336976bdcedbb468ff011c2340f6e26dbdfe7b41c7cd8f62a9ed56446',
            'CHANGELOG.md':'e22532563d1319656252edf4401338acdab03269ca5379e36968a63e86f37f11',
            'docs/semantic-prop-acceptance.md':'6780a215efb8fd60cf44fff58d85b5706e047adf593556a4a01e347a4a4c41a4',
            'docs/maintenance-issues.md':'a824aa9dc58d1049938117565e6d373f090f4dfcb710a6f110b0d22e7ed284ae'}
          for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          entries=[{'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()} for name in expected]
          Path('/tmp/home-restore-tree-request.json').write_text(json.dumps({'base_tree':'0fa97066a442b60d00e1b6707705c757f81d0ca1','tree':entries}))
          Path('/tmp/home-restore-hashes.json').write_text(json.dumps(expected,indent=2))
          PY
          gh api --method POST repos/wangfumin1/Latticefolk/git/trees --input /tmp/home-restore-tree-request.json --jq .sha > /tmp/home-restore-tree-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-home-restore-tree-${{ github.run_id }}
          path: |
            /tmp/home-restore-check.log
            /tmp/home-restore-tree-sha.txt
            /tmp/home-restore-hashes.json
          retention-days: 3
