name: One-shot validated layout tree transfer
on:
  push:
    branches: [transfer/69-bakery-layout]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact locally checked edits with source guards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/wangfumin1/Latticefolk/git/ref/heads/quality/69-bakery-visual --jq .object.sha)" = d85a6cd0f628003c1d34e296c915902a7198d84c
          test "$(gh api repos/wangfumin1/Latticefolk/git/ref/heads/main --jq .object.sha)" = 5bf5b78a8ca5e69adb18f3952f0d090d2614378d
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def replace(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,name;p.write_text(s.replace(old,new))
          assert hashlib.sha256(Path('src/main.ts').read_bytes()).hexdigest()=='a1636a66aa83db3490b25aa31159245aad08be56775f3848f970cfbf0486d48a'
          replace('src/main.ts',"import { planFineChunk } from './world/materialization';","import { planFineChunk } from './world/materialization';\nimport { restoreBuildingForLayout } from './world/buildingRestore';")
          replace('src/main.ts','if(saved&&object)Object.assign(object.state,structuredClone(saved),{chunkId:chunk.id});','if(saved&&object)Object.assign(object.state,restoreBuildingForLayout(object.state,saved));')
          replace('src/world/materialization.ts','''    const x=centerX+ox+jitterX,z=centerZ+oz+jitterZ;
              const rotationY=Math.atan2(centerX-x,centerZ-z);''','''    const x=centerX+ox+jitterX;
              // Reserve the existing utility cross-street before placing full-size buildings.
              // Clamp only inward Z jitter that would invade this 4.5 m strip; workstation
              // anchors, dimensions, IDs and RNG consumption remain unchanged.
              const proposedZ=centerZ+oz+jitterZ;
              const frontageLimit=centerZ+Math.sign(oz)*(d/2+2.25);
              const z=oz<0?Math.min(proposedZ,frontageLimit):Math.max(proposedZ,frontageLimit);
              // Lots and nature reservations are axis aligned. Diagonal buildings would
              // expand over the baked-in work sites even if their centers were in the lots.
              const rotationY=oz<0?0:Math.PI;''')
          old='- Already sourced tree/crate/mine/explicit-asset paths no longer construct discarded visible primitive placeholders. Generic drop/water/terrain/coarse paths remain tracked separately; this is not a whole-scene primitive-free claim.\n'
          replace('CHANGELOG.md',old,old+'- Generated buildings now face the axis-aligned utility street, and inward lot jitter is bounded by its reserved strip. This prevents full-size buildings from covering existing bakery/workstation anchors and their approach lanes without shrinking or disabling collision. Restoring old building saves preserves storage/resources but recomputes the derived frontage against the current model/trigger layout.\n')
          documentation='''## Generated lot and old-save frontage regression

          The first oven PR run (#1375 / `36542987638`, head `d85a6cd0f628003c1d34e296c915902a7198d84c`, executed merge-test `81e0a28ea076f0e8c5c78f9503e80934fac8f925`) passed the nine existing cases and home oven, but failed the generated approach. The downloaded report, native keyboard trace, pre-teardown state and screenshot showed player `(40.6,-22.5)` remaining stationary while a diagonally rotated market overlapped the oven. This was a runtime layout defect, not an asset-fetch failure, missing timeout, or wrong keyboard heading. Artifact `11021746491` has SHA-256 `ccb80c89872059e46500d991924f285118e3f6d1ff28a2cfd1a6ef3e1317bf0c`.

          The generator's land parcels and nature reservations are rectangular, but its previous diagonal yaw enlarged full-size building footprints across the utility street. Buildings now face that street with cardinal yaw. Only inward Z jitter that would invade the existing 4.5 m utility strip is clamped outward; workstation anchors, IDs, building dimensions and RNG consumption are retained. The browser fixture, player input, collision solver, target coordinates, retries and assertions are unchanged. `tests/baking-oven-layout.test.ts` first reproduced the original blockage, then checks the actual oven envelope and authoritative physical approach across 192 deterministic market/wetland layouts and all settlement levels.

          A building's saved `position` is its derived frontage, not a movable body anchor. `restoreBuildingForLayout` preserves stored items, resource values and mutable semantic state, while adopting the frontage already calculated for the current licensed model and trigger. Its regression covers a legacy diagonal frontage, no inventory aliasing/loss, identity/owner retention, mismatched restore rejection and repeat serialization. This is a layout-compatible version-1 restore, not a save reset or relocation of the oven/player. Final-head browser evidence remains required after any layout change.

          ## Still open'''
          replace('docs/semantic-prop-acceptance.md','## Still open',documentation)
          expected={
            'src/main.ts':'fcb13b5de8bb638996db6b0047d96e9a746e06e325a66cf0851860538b431379',
            'src/world/materialization.ts':'15de34b88f5ec774ca90ce6c52171a9bb756fc8e69f7b01d60db77c27841d32b',
            'CHANGELOG.md':'4a2f72542fcad192473c1db993cc2cb113170b45bac368f8fe6087e8a03d9300',
            'docs/semantic-prop-acceptance.md':'7d6f986f5ffe18dda87002421036cf21f9856458fa8d47a728ea2e59ce74e65d',
            'src/world/buildingRestore.ts':'79323cbe2ba7446aa4caf6db30f85ceb68c3124718322e9cf2021a050f4f27bd',
            'tests/baking-oven-layout.test.ts':'1264c1f52df6368b2a13069ab15ae08a6a8d03fad642cd08fb8b3df49e777180'}
          for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          import json
          Path('/tmp/layout-hashes.json').write_text(json.dumps(expected,indent=2))
          PY
      - name: Recheck fixed implementation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check 2>&1 | tee /tmp/layout-check.log
      - name: Upload only a Git tree object, never change a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/wangfumin1/Latticefolk/git/ref/heads/quality/69-bakery-visual --jq .object.sha)" = d85a6cd0f628003c1d34e296c915902a7198d84c
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/layout-hashes.json').read_text())
          entries=[{'path':name,'mode':'100644','type':'blob','content':Path(name).read_text()} for name in expected]
          Path('/tmp/layout-tree-request.json').write_text(json.dumps({'base_tree':'36fdac34588fedef69471deae0d1526c905b2aad','tree':entries}))
          PY
          gh api --method POST repos/wangfumin1/Latticefolk/git/trees --input /tmp/layout-tree-request.json --jq .sha > /tmp/layout-tree-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-layout-tree-${{ github.run_id }}
          path: |
            /tmp/layout-check.log
            /tmp/layout-tree-sha.txt
            /tmp/layout-hashes.json
          retention-days: 3
