name: Bootstrap repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'wangfumin1/Latticefolk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-595c-8230-8469-674573f059c5/raw?se=2026-09-21T08%3A12%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=582cf99a-169f-5bd3-a70b-2af52bd4f253&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T07%3A53%3A06Z&ske=2026-09-22T07%3A53%3A06Z&sks=b&skv=2026-02-06&sig=QiqytpbW0JeIYLfad4UmelmFuCuQ88ESLwDHJLhDLGk%3D' -o /tmp/latticefolk.zip
          rm -rf /tmp/latticefolk-import
          mkdir -p /tmp/latticefolk-import
          unzip -q /tmp/latticefolk.zip -d /tmp/latticefolk-import
          test -f /tmp/latticefolk-import/latticefolk/package.json
          rsync -a --delete --exclude='.git/' /tmp/latticefolk-import/latticefolk/ ./
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Initial open-source release"
          git push origin HEAD:main
