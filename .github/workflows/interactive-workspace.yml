name: Interactive workspace transfer

on:
  push:
    branches: [quality/69-bakery-visual]
    paths: [.github/workflows/interactive-workspace.yml]

permissions:
  contents: write

jobs:
  publish-validated-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard fresh base and decode exact locally checked patch
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git ls-remote --heads origin refs/heads/main refs/heads/quality/69-bakery-visual)"
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/main" {print $1}')" = 5bf5b78a8ca5e69adb18f3952f0d090d2614378d
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/quality/69-bakery-visual" {print $1}')" = "$GITHUB_SHA"
          test "$(git hash-object src/main.ts)" = 932a0d0fd7388e4af8008ac65c5c0b172dd4d7cb
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded=''.join(Path(f'.github/interactive-bakery.patch.{i}').read_text().strip() for i in (1,2,3))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1a603c8db9f7e196f5698d85293469eed8a0cad550601cc3050951cd6a507846'
          Path('/tmp/bakery-implementation.patch').write_bytes(patch)
          print('Verified exact 54089-byte locally checked implementation patch')
          PY
          git apply --check /tmp/bakery-implementation.patch
          git apply /tmp/bakery-implementation.patch
          printf '%s  %s\n' a1636a66aa83db3490b25aa31159245aad08be56775f3848f970cfbf0486d48a src/main.ts | sha256sum --check
      - name: Vendor unchanged author release with immutable digest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 60 --retry 0 'https://opengameart.org/sites/default/files/cast_iron_stove_gltf.zip' -o /tmp/oven.zip
          printf '%s  %s\n' ea72cf242b76d25e70aff9e3b5277d7f232bf2feac9e137b69595e430f3b87db /tmp/oven.zip | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target=Path('public/assets/firefly-in-the-dusk/cast-iron-stove')
          with ZipFile('/tmp/oven.zip') as archive:
              for name in ('CastIronStove.gltf','CastIronStove.bin','CastIronStoveTex.png','FriedEggTexture.png'):
                  destination=target/('CastIronStove.source.gltf' if name=='CastIronStove.gltf' else name)
                  destination.write_bytes(archive.read(name))
          PY
          npm run assets:prepare
      - name: Check the transferred implementation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check 2>&1 | tee /tmp/bakery-check.log
      - name: Remove transport and fast-forward only the same branch
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git ls-remote --heads origin refs/heads/main refs/heads/quality/69-bakery-visual)"
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/main" {print $1}')" = 5bf5b78a8ca5e69adb18f3952f0d090d2614378d
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/quality/69-bakery-visual" {print $1}')" = "$GITHUB_SHA"
          git rm .github/workflows/interactive-workspace.yml .github/interactive-bakery.patch.1 .github/interactive-bakery.patch.2 .github/interactive-bakery.patch.3
          git add .gitignore CHANGELOG.md THIRD_PARTY_ASSETS.md THIRD_PARTY_NOTICES.md docs/asset-preparation.md docs/maintenance-issues.md docs/semantic-prop-acceptance.md e2e/baking-oven.spec.ts public/assets/firefly-in-the-dusk/cast-iron-stove scripts/lib/baking-oven-assets.d.mts scripts/lib/baking-oven-assets.mjs scripts/prepare-scene-assets.mjs src/main.ts src/scene/bakingOven.ts tests/baking-oven.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: replace home and generated bakery primitives with licensed baking oven (#69)'
          git push origin HEAD:refs/heads/quality/69-bakery-visual
          git rev-parse HEAD > /tmp/implementation-head.txt
          git show --stat --oneline HEAD > /tmp/implementation-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bakery-transfer-validation-${{ github.run_id }}
          path: |
            /tmp/bakery-check.log
            /tmp/implementation-head.txt
            /tmp/implementation-files.txt
          retention-days: 3
