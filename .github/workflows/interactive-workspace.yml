name: Interactive workspace transfer

on:
  push:
    branches: [quality/69-bakery-visual]
    paths: [.github/workflows/interactive-workspace.yml]

permissions:
  contents: read

jobs:
  source-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download original author release and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/oven-source
          curl --fail --location --max-time 60 --retry 0 'https://opengameart.org/sites/default/files/cast_iron_stove_gltf.zip' -o /tmp/oven-source/cast_iron_stove_gltf.zip
          curl --fail --location --max-time 60 --retry 0 'https://opengameart.org/content/cast-iron-stove' -o /tmp/oven-source/author-page.html
          cd /tmp/oven-source
          sha256sum cast_iron_stove_gltf.zip author-page.html > SHA256SUMS
          unzip -l cast_iron_stove_gltf.zip
      - uses: actions/upload-artifact@v4
        with:
          name: original-cc0-oven-${{ github.run_id }}
          path: /tmp/oven-source/
          retention-days: 1
