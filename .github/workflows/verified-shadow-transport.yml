name: Verify fixed interactive patch objects
on:
  push:
    branches: [interactive/78-verified-shadow-patch]
permissions:
  contents: write
jobs:
  verify-fixed-patch:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply the exact locally tested patch to its exact base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          manifest=json.loads(pathlib.Path('.interactive/manifest.json').read_text())
          assert manifest['base']=='36d485b816695f0f0da2c8da242265869e03410f'
          assert manifest['base_tree']=='06b5461e9d9bc0fcff9a67977ee623e97a77fedc'
          archive=b''.join(pathlib.Path(f'.interactive/patch.{i}.part').read_bytes() for i in range(4))
          assert hashlib.sha256(archive).hexdigest()==manifest['archive_sha256']
          patch=gzip.decompress(archive)
          assert hashlib.sha256(patch).hexdigest()==manifest['patch_sha256']
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-fixed.patch';path.write_bytes(patch)
          subprocess.run(['git','checkout','--detach',manifest['base']],check=True)
          assert git('rev-parse','HEAD^{tree}')==manifest['base_tree']
          subprocess.run(['git','apply','--index','--unidiff-zero','--whitespace=error-all',str(path)],check=True)
          assert git('diff','--cached','--name-only').splitlines()==manifest['paths']
          assert all(not p.startswith('.') and p!='package-lock.json' for p in manifest['paths'])
          assert git('write-tree')==manifest['tree']
          # Create unreferenced objects ONLY. No branch, PR, issue, merge or task updates.
          entries=[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text()} for p in manifest['paths']]
          payload=json.dumps({'base_tree':manifest['base_tree'],'tree':entries}).encode()
          req=urllib.request.Request('https://api.github.com/repos/wangfumin1/Latticefolk/git/trees',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          # One request; rate limits/errors fail closed, with no retry or endpoint switching.
          with urllib.request.urlopen(req,timeout=60) as response:result=json.load(response)
          assert result['sha']==manifest['tree']
          record={**manifest,'verified_tree':result['sha'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ref_updates':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'verified-tree.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently check the transferred source tree
        run: npm install --no-audit --no-fund && npm run assets:prepare && npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-shadow-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-tree.json
          if-no-files-found: error
          retention-days: 1
